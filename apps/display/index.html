<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WDL — board</title>
<link rel="stylesheet" href="board.css">
<link rel="stylesheet" href="../shared/body-map.css">
</head>
<body>

<!--
  The board.

  The whiteboard is the workout as written, unchanged. Nothing is reformatted,
  re-ordered or expanded for the screen: what you glance at mid-set has to be the
  same shape as what you wrote, or the format's whole premise is decorative.

  Everything the runtime adds — where you are, how long is left — sits in the bar
  above it and in a marker in the left gutter. The text itself is never rewritten.
-->

<header id="bar" hidden>
  <div class="now">
    <div class="label" id="now-label">—</div>
    <div class="sub" id="now-sub"></div>
  </div>
  <div id="bodymap" class="bodymap small"></div>
  <div class="clock">
    <div class="time" id="clock">0:00</div>
    <div class="sub" id="clock-sub"></div>
  </div>
</header>

<!--
  The preamble, lifted off the board.

  The `# title`, `@id` and `@tags` are metadata *about* the workout, not the
  workout, so they sit in the chrome here rather than as rows the athlete has to
  read past mid-set. The title leads; a bare `@id` shows verbatim, but
  parenthesised after a title (`Fran (crossfit:fran)`). Shown only when the file
  sets at least one of the three; the rest of the `@key` preamble (`@wdl`,
  `@date`, …) is simply not board material.
-->
<div id="meta" class="meta" hidden></div>

<main>
  <section id="board" class="board" aria-live="off">
    <div class="empty">
      <h1>Board</h1>
      <p>Drop a <code>.wdl</code> file here, or paste one in.</p>
      <textarea id="paste" spellcheck="false" placeholder="21-15-9:&#10;  - Thruster @ 95lb&#10;  - Pull-Up"></textarea>
      <div class="samples" id="samples"></div>
    </div>
  </section>
  <p id="problems" class="problems" hidden></p>

  <!--
    What you just did, written down.

    The board is the only thing in this project that knows how a session
    actually went — it held the clock and the cursor — so it is the only thing
    that can write the record. What it writes is *editable text*, in the format
    itself, because a result that reads on a whiteboard is the same constraint
    the workout is under: you should be able to see what is being claimed about
    you before you keep it.
  -->
  <section id="record" class="record" hidden>
    <h2>Result</h2>
    <p class="hint">What the board measured. Everything it could not — what you
      lifted, how it felt — is yours to add.</p>
    <textarea id="record-text" spellcheck="false"></textarea>
    <div class="record-actions">
      <button id="record-save" class="primary">Download</button>
      <button id="record-copy">Copy</button>
      <button id="record-close">Close</button>
      <span id="record-said" class="said" role="status"></span>
    </div>
  </section>
</main>

<footer id="controls" hidden>
  <button id="start" class="primary">Start</button>
  <button id="next">Next <kbd>space</kbd></button>
  <button id="prev">Back</button>
  <!-- Only shown inside a section that repeats: a block with no clock ends when
       the athlete says it does, and nothing else can say it for them. -->
  <button id="leave" hidden>End section <kbd>e</kbd></button>
  <button id="reset">Reset</button>
  <!-- Clears the red notifications strip below the board until the next parse or
       division change repopulates it. Shown only while the strip has content. -->
  <button id="clear-notifs" hidden>Clear notifications</button>
  <!-- Shown once a session has begun: a workout you stopped halfway is still
       something that happened, and Reset is right there waiting to erase it. -->
  <button id="record-open" hidden>Result</button>
  <span class="spacer"></span>
  <!-- Only shown by a workout that offers a division. Choosing one is a
       *reader's* action: it changes which weights the bar above calls out, and
       never the text on the board, which goes on saying what the file says. -->
  <label id="division-pick" class="division" hidden>Division
    <select id="division"></select>
  </label>
  <span id="position" class="position"></span>
  <!-- Opens the builder on this workout in a new tab (`../builder/?w=<key>`).
       Shown only when the board is showing a workout resolved from `?w=` — a
       raw `#<source>` paste has no saved record to round-trip to. -->
  <button id="edit" hidden>Edit in builder ↗</button>
</footer>

<script type="module" src="board.js"></script>
</body>
</html>
