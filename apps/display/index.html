<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WDL — board</title>
<link rel="stylesheet" href="board.css">
</head>
<body>

<!--
  The board.

  The whiteboard is the workout as written, unchanged. Nothing is reformatted,
  re-ordered or expanded for the screen: what you glance at mid-set has to be the
  same shape as what you wrote, or the format's whole premise is decorative.

  Everything the runtime adds — where you are, how long is left — sits in the bar
  above it and in a marker in the left gutter. The text itself is never rewritten.
-->

<header id="bar" hidden>
  <div class="now">
    <div class="label" id="now-label">—</div>
    <div class="sub" id="now-sub"></div>
  </div>
  <div class="clock">
    <div class="time" id="clock">0:00</div>
    <div class="sub" id="clock-sub"></div>
  </div>
</header>

<main>
  <section id="board" class="board" aria-live="off">
    <div class="empty">
      <h1>Board</h1>
      <p>Drop a <code>.wdl</code> file here, or paste one in.</p>
      <textarea id="paste" spellcheck="false" placeholder="21-15-9:&#10;  - Thruster @ 95lb&#10;  - Pull-Up"></textarea>
      <div class="samples" id="samples"></div>
    </div>
  </section>
  <p id="problems" class="problems" hidden></p>
</main>

<footer id="controls" hidden>
  <button id="start" class="primary">Start</button>
  <button id="next">Next <kbd>space</kbd></button>
  <button id="prev">Back</button>
  <!-- Only shown inside a section that repeats: a block with no clock ends when
       the athlete says it does, and nothing else can say it for them. -->
  <button id="leave" hidden>End section <kbd>e</kbd></button>
  <button id="reset">Reset</button>
  <span class="spacer"></span>
  <span id="position" class="position"></span>
  <button id="edit">Edit</button>
</footer>

<script type="module" src="board.js"></script>
</body>
</html>
