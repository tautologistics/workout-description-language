# WDL — single vhost. REFERENCE ONLY for a self-managed nginx host.
# The live instance is a DreamHost managed VPS with no root: nginx is
# panel-owned and the DreamHost panel Proxy Server does this job instead
# (whole domain -> 127-unreachable -> public-IP:8090). See deploy/README.md.
#
# PocketBase is reverse-proxied SAME-ORIGIN under /api/ and /_/ so the static
# apps just call /api/... with no CORS surface (DEC-016). The static apps
# themselves are served from / — item 19 fills in WDL_WEBROOT and the caching;
# for item 18 only the /api/ and /_/ proxy blocks need to be live.
#
# Substitute before use:
#   WDL_DOMAIN    the vhost hostname, e.g. wdl.example.com
#   WDL_WEBROOT   the static deploy target (item 19), e.g. /home/USER/wdl-web
# PocketBase is assumed on 127.0.0.1:8090 (its default --http port).
#
# Install: copy to the box, substitute, then either
#   - certbot --nginx -d WDL_DOMAIN   (writes the 443 server block + redirect), or
#   - provision the cert by hand (see deploy/README.md) and keep both blocks.

server {
    listen 80;
    listen [::]:80;
    server_name WDL_DOMAIN;

    # Let certbot answer ACME challenges here if provisioning by hand.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name WDL_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/WDL_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/WDL_DOMAIN/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;   # if certbot dropped one

    # --- PocketBase REST API + OAuth2 redirect ------------------------------
    # OAuth redirect target registered in Google Cloud Console is
    #   https://WDL_DOMAIN/api/oauth2-redirect
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # PocketBase realtime is Server-Sent Events: no buffering, long timeout.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;

        client_max_body_size 25m;   # a .wdl body is tiny; this is slack.
    }

    # --- PocketBase admin UI ----------------------------------------------
    location /_/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Static apps — item 19 completes this ----------------------------
    # The apps fetch by relative path from a repo-shaped tree; serve.mjs is the
    # behaviour to reproduce. Uncomment and point WDL_WEBROOT at the deployed
    # copy of apps/ + build/web/ + spec/grammar-0.1.ohm + registry/*.json +
    # examples/ once item 19 lands the deploy script.
    #
    # root WDL_WEBROOT;
    # index index.html;
    #
    # # MIME types serve.mjs sets that stock nginx's mime.types lacks. A second
    # # `types` block at this level merges with the included map.
    # include /etc/nginx/mime.types;
    # types { text/plain ohm wdl wdlg wdlp; }
    # default_type application/octet-stream;
    #
    # location = / { return 302 /apps/builder/; }
    # location / {
    #     try_files $uri $uri/ =404;
    #     add_header Cache-Control "no-cache, must-revalidate";
    # }

    # Until item 19: everything that is not PocketBase is not here yet.
    location / { return 404 "wdl: static apps not deployed yet (queue item 19)\n"; }
}
